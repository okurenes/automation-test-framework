version: '3.9'

services:
  # Run smoke tests
  test-smoke:
    build: .
    container_name: pw-smoke-tests
    environment:
      - TEST_ENV=staging
      - CI=true
    volumes:
      - ./reports:/app/reports
      - ./test-results:/app/test-results
    command: npx playwright test --grep @smoke --project="iPhone 14"

  # Run regression tests
  test-regression:
    build: .
    container_name: pw-regression-tests
    environment:
      - TEST_ENV=staging
      - CI=true
    volumes:
      - ./reports:/app/reports
      - ./test-results:/app/test-results
    command: npx playwright test --grep "@smoke|@regression" --project="iPhone 14" --retries=2

  # Run full suite on all devices
  test-full:
    build: .
    container_name: pw-full-tests
    environment:
      - TEST_ENV=staging
      - CI=true
    volumes:
      - ./reports:/app/reports
      - ./test-results:/app/test-results
    command: npx playwright test --retries=2

  # Run API tests only
  test-api:
    build: .
    container_name: pw-api-tests
    environment:
      - TEST_ENV=staging
      - CI=true
    volumes:
      - ./reports:/app/reports
    command: npx playwright test --grep @api --project="iPhone 14"

  # Generate Allure report
  allure-report:
    image: frankescobar/allure-docker-service:latest
    container_name: allure-report
    ports:
      - "5050:5050"
    environment:
      CHECK_RESULTS_EVERY_SECONDS: 5
      KEEP_HISTORY: 1
    volumes:
      - ./reports/allure-results:/app/allure-results
      - ./reports/allure-report:/app/default-reports
